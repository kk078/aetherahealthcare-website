name: Draft an article for editorial review
on:
  schedule:
    - cron: '0 13 * * 2,5'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: auto-blog-draft
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate draft only
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
          OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: node scripts/auto-blog.mjs
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: editorial/generated-draft
          title: 'Editorial review: generated article draft'
          commit-message: 'content: add article draft for review'
          add-paths: content/drafts/
          body: |
            This changes draft content only and does not publish an article.

            An accountable reviewer must verify billing claims, add primary source URLs and a review date, and promote the draft through scripts/publish-blog-draft.mjs. The normal release checks apply to publication.
