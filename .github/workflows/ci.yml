name: CI — Pull Request Checks

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch: {}

jobs:
  # ── 1. Next.js build + type check ─────────────────────────────────────────
  build:
    name: Next.js Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js site (includes TypeScript check)
        run: npm run build
        env:
          NEXT_PUBLIC_GOOGLE_ADS_ID: AW-18295729018

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-out
          path: out/
          retention-days: 1

  # ── 2. Playwright E2E ─────────────────────────────────────────────────────
  # Page tests run against the PR's own build served locally; header and API
  # tests run read-only against production. No test POSTs live form data
  # (the contact-form live-submit test self-skips without E2E_LIVE_SUBMIT=1).
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-out
          path: out

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Serve the built site
        run: python3 -m http.server 3000 --directory out &

      - name: Page tests (against this build)
        run: npx playwright test tests/e2e/smoke.spec.ts tests/e2e/contact-form.spec.ts tests/e2e/gap-analysis-redirect.spec.ts --project=chromium
        env:
          BASE_URL: http://localhost:3000

      - name: Security-header & API tests (against production, read-only)
        run: npx playwright test tests/e2e/security-headers.spec.ts tests/e2e/crm-api.spec.ts --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ci
          path: playwright-report/
          retention-days: 7
