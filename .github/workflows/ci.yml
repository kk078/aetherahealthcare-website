name: Verify and release website
on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  NEXT_PUBLIC_GOOGLE_ADS_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_ADS_ID || 'AW-18295729018' }}
  NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID || 'G-898JNZJ6LJ' }}
  NEXT_PUBLIC_GADS_LABEL_ASSESSMENT: ${{ vars.NEXT_PUBLIC_GADS_LABEL_ASSESSMENT }}
  NEXT_PUBLIC_GADS_LABEL_CONTACT: ${{ vars.NEXT_PUBLIC_GADS_LABEL_CONTACT }}
  NEXT_PUBLIC_GADS_LABEL_MEETING: ${{ vars.NEXT_PUBLIC_GADS_LABEL_MEETING }}
  NEXT_PUBLIC_GADS_LABEL_BOOKING: ${{ vars.NEXT_PUBLIC_GADS_LABEL_BOOKING }}
  NEXT_PUBLIC_GADS_LABEL_PILOT: ${{ vars.NEXT_PUBLIC_GADS_LABEL_PILOT }}
  NEXT_PUBLIC_GADS_LABEL_CALCULATOR: ${{ vars.NEXT_PUBLIC_GADS_LABEL_CALCULATOR }}
  NEXT_PUBLIC_LINKEDIN_PARTNER_ID: ${{ vars.NEXT_PUBLIC_LINKEDIN_PARTNER_ID }}
  NEXT_PUBLIC_META_PIXEL_ID: ${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}
  NEXT_PUBLIC_RB2B_KEY: ${{ vars.NEXT_PUBLIC_RB2B_KEY }}
  NEXT_PUBLIC_APOLLO_ID: ${{ vars.NEXT_PUBLIC_APOLLO_ID }}
  NEXT_PUBLIC_LEADFEEDER_ID: ${{ vars.NEXT_PUBLIC_LEADFEEDER_ID }}
  NEXT_PUBLIC_SNITCHER_ID: ${{ vars.NEXT_PUBLIC_SNITCHER_ID }}
  NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ vars.NEXT_PUBLIC_CF_BEACON_TOKEN }}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx wrangler pages functions build functions --outdir /tmp/aethera-functions
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
      - run: npx playwright test tests/e2e/enhancement-regressions.spec.ts --project=mobile-chrome
      - uses: actions/upload-artifact@v4
        with:
          name: verified-site
          path: out/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-evidence
          path: |
            /tmp/aethera-playwright-report/
            /tmp/aethera-e2e-results/
  deploy:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: aetherahealthcare-website (Production)
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: verified-site
          path: out
      - name: Prepare database, migrate and deploy verified artifact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RATE_LIMIT_SECRET: ${{ secrets.RATE_LIMIT_SECRET }}
          LEAD_RETRY_SECRET: ${{ secrets.LEAD_RETRY_SECRET }}
        run: |
          node scripts/prepare-deploy.mjs
          npx wrangler d1 migrations apply aethera-website-leads --remote --config wrangler.jsonc
          npx wrangler pages deploy out --project-name=aetherahealthcare-website --branch="$(cat .wrangler/production-branch)"
