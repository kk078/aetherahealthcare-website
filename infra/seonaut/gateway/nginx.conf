# Egress gateway for the SEOnaut crawler. See ../docker-compose.yml for the rationale.
worker_processes 1;
error_log /var/log/aethera/error.log warn;
events { worker_connections 64; }

http {
  # Docker's embedded DNS; variables in proxy_pass resolve per request, so start order does not matter.
  resolver 127.0.0.11 ipv6=off valid=60s;
  log_format crawl '$time_iso8601\t$status\t$upstream_status\t$request_method\t$request_uri\t$request_time';

  # Polite crawling: at most 2 requests/s upstream; bursts queue (delay) instead of failing.
  limit_req_zone $server_port zone=polite:1m rate=2r/s;

  # ---- Crawl target: http://seo-gateway:8080 -> https://aetherahealthcare.com
  server {
    listen 8080;
    server_name seo-gateway;
    access_log /var/log/aethera/crawl.log crawl;
    set $origin aetherahealthcare.com;

    # HIPAA hygiene: authenticated / app surfaces are never fetched. Answered locally, never forwarded.
    location ~* ^/(portal|api)(/|$) {
      access_log /var/log/aethera/blocked.log crawl;
      default_type text/plain;
      return 403 "Excluded from SEO crawling\n";
    }

    # Real robots.txt plus our own exclusions, so SEOnaut never even queues those paths.
    location = /robots.txt {
      limit_req zone=polite burst=20;
      proxy_pass https://$origin/robots.txt;
      include /etc/nginx/aethera_proxy.conf;
    }

    location / {
      limit_req zone=polite burst=20;
      proxy_pass https://$origin$request_uri;
      include /etc/nginx/aethera_proxy.conf;
    }
  }

  # ---- SEOnaut UI (published on 127.0.0.1 only by docker-compose)
  server {
    listen 9000;
    access_log off;
    client_max_body_size 5m;
    set $seonaut app:9000;
    location / {
      proxy_pass http://$seonaut;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;
    }
  }

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
}
