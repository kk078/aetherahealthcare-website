# Shared upstream settings for the crawl gateway (included from nginx.conf).
proxy_ssl_server_name on;
proxy_ssl_name $origin;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_http_version 1.1;
proxy_set_header Host $origin;
proxy_set_header User-Agent "AetheraSEOBot/1.0 (+https://aetherahealthcare.com/; SEO monitoring; SEOnaut)";
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_set_header Accept-Encoding "";
proxy_hide_header Set-Cookie;
proxy_connect_timeout 15s;
proxy_read_timeout 30s;

# Keep the crawl on the gateway host so links, canonicals and the sitemap stay "internal" to SEOnaut.
# The exporter maps http://seo-gateway:8080 back to https://aetherahealthcare.com.
proxy_redirect https://aetherahealthcare.com/ http://seo-gateway:8080/;
sub_filter_once off;
sub_filter_types text/xml application/xml text/plain;
sub_filter "https://aetherahealthcare.com" "http://seo-gateway:8080";
sub_filter "User-agent: *" "User-agent: *\nDisallow: /portal/\nDisallow: /api/";
