name: LinkedIn Auto-Publisher

# Automatically publishes Carousels, Infographics, and Thought-Leadership to LinkedIn.
# Runs on schedule or on-demand via workflow_dispatch.

on:
  schedule:
    - cron: '0 14 * * 2,4' # Tuesdays and Thursdays at 9:00 AM ET (14:00 UTC)
  workflow_dispatch:
    inputs:
      campaign:
        description: 'Select Campaign to publish (or choose "next_in_queue")'
        required: true
        type: choice
        default: 'next_in_queue'
        options:
          - 'next_in_queue'
          - 'clean_claim'
          - 'india_ai'
          - 'ai_integration_stack'
          - 'payer_ai_arms_race'
          - 'death_of_manual_bpo'
          - 'hcc_v28'
          - 'biller_departure'
          - 'fifty_claim_challenge'
      dry_run:
        description: 'Perform dry-run simulation only (preview without posting)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: linkedin-publisher
  cancel-in-progress: false

jobs:
  publish-to-linkedin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Execute Campaign Publisher
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="--dry-run"
          else
            FLAGS="--publish"
          fi

          if [ "${{ github.event.inputs.campaign }}" = "next_in_queue" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Publishing next queued campaign..."
            node scripts/linkedin-publisher.mjs --publish-next $FLAGS
          else
            echo "Publishing selected campaign: ${{ github.event.inputs.campaign }}"
            node scripts/linkedin-publisher.mjs --campaign "${{ github.event.inputs.campaign }}" $FLAGS
          fi

      - name: Commit Updated Ledger
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/published-posts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(marketing): update published campaigns ledger [skip ci]" && git push)
