name: LinkedIn Auto-Publisher

# Automatically publishes Document Carousels to LinkedIn.
# Runs weekly on Tuesdays at 13:30 UTC (~9:30 AM ET) or on-demand via workflow_dispatch.

on:
  schedule:
    - cron: '30 13 * * 2' # Tuesdays at 9:30 AM ET
  workflow_dispatch:
    inputs:
      carousel:
        description: 'Select Carousel to publish'
        required: true
        type: choice
        default: 'clean_claim'
        options:
          - 'clean_claim'
          - 'hcc_v28'
          - 'biller_departure'
      dry_run:
        description: 'Perform dry-run simulation only (preview without posting)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: linkedin-publisher
  cancel-in-progress: false

jobs:
  publish-to-linkedin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Determine Campaign
        id: select_campaign
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "carousel=${{ github.event.inputs.carousel }}" >> $GITHUB_OUTPUT
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              echo "flags=--dry-run" >> $GITHUB_OUTPUT
            else
              echo "flags=--publish" >> $GITHUB_OUTPUT
            fi
          else
            # Scheduled rotation: Week 1, 2, 3 based on week of year
            WEEK_NUM=$(date +%V)
            REMAINDER=$((WEEK_NUM % 3))
            if [ "$REMAINDER" -eq 0 ]; then
              echo "carousel=clean_claim" >> $GITHUB_OUTPUT
            elif [ "$REMAINDER" -eq 1 ]; then
              echo "carousel=hcc_v28" >> $GITHUB_OUTPUT
            else
              echo "carousel=biller_departure" >> $GITHUB_OUTPUT
            fi
            echo "flags=--publish" >> $GITHUB_OUTPUT
          fi

      - name: Run LinkedIn Auto-Publisher
        env:
          LINKEDIN_LI_AT: ${{ secrets.LINKEDIN_LI_AT }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
        run: |
          node scripts/linkedin-publisher.mjs --carousel "${{ steps.select_campaign.outputs.carousel }}" ${{ steps.select_campaign.outputs.flags }}

      - name: Upload Logs & Verification Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-publish-logs
          path: public/brand/carousel/publish_logs/
          if-no-files-found: ignore
